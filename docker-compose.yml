services:
  db:
    image: postgres:14
    container_name: tsa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trucksigns_db}
      POSTGRES_USER: ${DB_USER:-trucksigns_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/majoneko/trucksigns-api:${GITHUB_SHA:-latest}
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: tsa_backend
    restart: unless-stopped
    networks:
      - tsa-network
    environment:
      MODE: ${MODE:-prod}
      DEBUG_ENABLED: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_NAME: ${DB_NAME:-trucksigns_db}
      DB_USER: ${DB_USER:-trucksigns_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-Admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
    volumes:
      - static_volume:/app/src/staticfiles
      - media_volume:/app/src/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8020}:8020"

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  tsa-network:
    driver: bridge
